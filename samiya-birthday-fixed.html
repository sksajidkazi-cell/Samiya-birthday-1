<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday, Samiya</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,600..900&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#130e2b; --bg2:#2d1b5e; --ink:#fbf1f8; --muted:#c7b9e6;
  --rose:#ff9db5; --gold:#ffd98a; --lilac:#b9a7f0; --card:rgba(255,255,255,.09);
  --btn:#2b1a4d; --star:#ffffff;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){
    color-scheme:light;
    --bg:#fdeef4; --bg2:#e6d6fb; --ink:#2b1a4d; --muted:#6a5990;
    --rose:#d6436f; --gold:#b87408; --lilac:#6a4fd0; --card:rgba(255,255,255,.72); --star:#9b7be0;
  }
}
:root[data-theme="dark"]{color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;min-height:100vh;color:var(--ink);overflow-x:hidden;
  font-family:"Nunito",system-ui,sans-serif;font-size:18px;line-height:1.7;
  background:
    radial-gradient(900px 500px at 15% 8%,rgba(255,157,181,.18),transparent 70%),
    radial-gradient(900px 600px at 90% 30%,rgba(185,167,240,.2),transparent 70%),
    radial-gradient(1100px 700px at 50% 0%,var(--bg2),var(--bg) 72%) var(--bg);
  background-attachment:fixed;
}
#sky,#balloons,#conf{position:fixed;inset:0;overflow:hidden;pointer-events:none}
#sky{z-index:0}#balloons{z-index:1}#conf{z-index:6;width:100%;height:100%}
.tw{position:absolute;border-radius:50%;background:var(--star);animation:tw ease-in-out infinite alternate}
@keyframes tw{from{opacity:.1;transform:scale(.7)}to{opacity:.9;transform:scale(1.2)}}
.fall{position:absolute;top:0;left:0;animation:fall linear forwards;will-change:transform}
@keyframes fall{from{transform:translate3d(0,-200px,0)}to{transform:translate3d(0,calc(100vh + 240px),0)}}
.sway{animation:sway ease-in-out infinite alternate;transform-origin:50% 0}
@keyframes sway{from{transform:translateX(-14px) rotate(-5deg)}to{transform:translateX(14px) rotate(5deg)}}
.b{position:relative;border-radius:50% 50% 50% 50%/58% 58% 42% 42%;
  box-shadow:inset -8px -10px 18px rgba(0,0,0,.18),inset 8px 8px 14px rgba(255,255,255,.28)}
.b::before{content:"";position:absolute;left:50%;bottom:-7px;margin-left:-6px;border:6px solid transparent;border-bottom-color:inherit;border-top:0;filter:brightness(.85)}
.b::after{content:"";position:absolute;left:50%;top:100%;width:1.5px;height:70px;background:rgba(255,255,255,.4);margin-top:5px}
main{position:relative;z-index:2;max-width:620px;margin:0 auto;min-height:100vh;
  padding:52px 22px 56px;display:flex;flex-direction:column;align-items:center;text-align:center}
h1{margin:0;font-family:"Fraunces",Georgia,serif;font-style:italic;font-weight:600;line-height:1.1}
.l1{display:block;font-size:clamp(34px,10vw,58px);color:var(--muted)}
.l2{display:block;font-size:clamp(68px,21vw,136px);font-weight:900;margin-top:4px;line-height:1.25;padding-bottom:.1em}
.w{display:inline-block;white-space:nowrap}
.ch{display:inline-block;opacity:0;transform:translateY(26px) scale(.6) rotate(-8deg);
  animation:pop .55s cubic-bezier(.2,1.5,.4,1) forwards}
/* unique teal -> sky -> violet gradient for the name */
.l2 .ch{padding:0 .07em .22em .03em;margin-bottom:-.22em;
  background:linear-gradient(180deg,#9dffd9 15%,#6fb8ff 55%,#d28bff 95%);
  -webkit-background-clip:text;background-clip:text;color:transparent}
@keyframes pop{to{opacity:1;transform:none}}
.shine{animation:glow 2.4s ease-in-out 1}
@keyframes glow{50%{filter:drop-shadow(0 0 16px #6fe0b5)}}

.cal{width:108px;margin-top:18px;border-radius:13px;overflow:hidden;background:#fff8fb;color:#2b1a4d;
  box-shadow:0 14px 30px rgba(0,0,0,.35);transform-origin:50% 0;transform:rotate(-4deg) rotateX(-95deg);opacity:0;position:relative}
.cal.in{animation:flip 1.1s cubic-bezier(.3,1.4,.5,1) forwards}
@keyframes flip{to{transform:rotate(-4deg) rotateX(0);opacity:1}}
.cal .top{background:var(--rose);color:#fff;font-weight:700;font-size:16px;padding:5px 0 4px}
.cal .num{font-family:"Fraunces",Georgia,serif;font-style:italic;font-weight:600;font-size:58px;line-height:1.05;padding:2px 0 6px}
.cal .holes{position:absolute;top:-6px;left:0;right:0;display:flex;justify-content:space-around;padding:0 22px}
.cal .holes i{width:11px;height:11px;border-radius:50%;background:var(--bg)}

/* the cake scene */
.scene{width:min(440px,100%);margin-top:34px;border-radius:24px;overflow:hidden;
  box-shadow:0 18px 44px rgba(0,0,0,.4),0 0 0 1px rgba(255,255,255,.12);opacity:0;transform:translateY(20px);transition:opacity .8s,transform .8s}
.scene.in{opacity:1;transform:none}
#scene{display:block;width:100%;height:auto}
#dim{opacity:.55;transition:opacity 1.1s}
#scene.d2 #dim{opacity:.9}#scene.d0 #dim{opacity:0}
#arm{transform-origin:84px 156px;transform:rotate(24deg)}
.lit #arm{animation:armLight 3.6s ease-in-out forwards}
.cut #arm{animation:armCut 2.8s ease-in-out forwards}
@keyframes armLight{
  0%{transform:rotate(24deg) scaleX(1)}
  25%,33%{transform:rotate(-37deg) scaleX(.92)}
  45%,52%{transform:rotate(-31.7deg) scaleX(1.058)}
  65%,72%{transform:rotate(-27.5deg) scaleX(1.2)}
  100%{transform:rotate(24deg) scaleX(1)}}
@keyframes armCut{
  0%{transform:rotate(24deg)}30%{transform:rotate(-8deg)}
  55%{transform:rotate(14deg)}70%{transform:rotate(12deg)}100%{transform:rotate(24deg)}}
#match,#knife{opacity:0;transition:opacity .25s}
.lit #match{opacity:1}.blow #match{opacity:0}.cut #knife{opacity:1}
.fl{opacity:0}
.lit .fl{animation:ignite .45s var(--d) forwards}
.out .fl{animation:snuff .25s var(--o) forwards}
@keyframes ignite{from{opacity:0;transform:scale(.2)}to{opacity:1;transform:scale(1)}}
@keyframes snuff{from{opacity:1;transform:scale(1)}to{opacity:0;transform:scale(.1)}}
.fk{transform-box:fill-box;transform-origin:50% 100%;animation:flick .45s ease-in-out infinite alternate}
@keyframes flick{from{transform:scale(1,1)}to{transform:scale(.88,1.12)}}
.sm{opacity:0}
.out .sm{animation:smoke 2s .15s forwards}
@keyframes smoke{0%{opacity:.85;transform:translateY(0)}100%{opacity:0;transform:translateY(-28px)}}
.blow #head{animation:lean 2.2s forwards}
.happy #head{animation:bob .5s ease-in-out 3}
@keyframes lean{0%{transform:none}22%,82%{transform:translate(8px,3px) rotate(11deg)}100%{transform:none}}
@keyframes bob{50%{transform:rotate(-6deg) translateY(-4px)}}
#mO{opacity:0}
.blow #mO{animation:mo 2.2s forwards}.blow #mS{animation:ms 2.2s forwards}
@keyframes mo{0%,20%{opacity:0}24%,80%{opacity:1}84%,100%{opacity:0}}
@keyframes ms{0%,20%{opacity:1}24%,80%{opacity:0}84%,100%{opacity:1}}
.puff{opacity:0}
.blow .puff{animation:puff .8s ease-out var(--p) forwards}
@keyframes puff{0%{opacity:0;transform:translate(0,0)}25%{opacity:.9}100%{opacity:0;transform:translate(72px,-12px)}}
#gap,#slice{opacity:0}
#slice{transform-origin:316px 212px;transform:scale(.3)}
.cut #gap{animation:fin .3s 1.5s forwards}
.cut #slice{animation:slin .55s 2s cubic-bezier(.3,1.6,.5,1) forwards}
@keyframes fin{to{opacity:1}}
@keyframes slin{to{opacity:1;transform:scale(1)}}
.cap{font-family:"Fraunces",Georgia,serif;font-style:italic;font-size:clamp(22px,6vw,28px);color:var(--gold);
  margin:18px 0 0;min-height:2.4em;transition:opacity .3s}

/* message stage: no buttons, everything plays on its own and stays on screen */
.stage{display:none;width:100%;margin-top:22px}
.stage.show{display:block;animation:up .9s ease-out both}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.card{background:var(--card);border-radius:22px;padding:28px 24px;min-height:220px;
  display:flex;align-items:center;justify-content:center;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.14)}
.msg{margin:0;font-size:clamp(19px,5vw,23px);line-height:1.65}
.msg.big{font-family:"Fraunces",Georgia,serif;font-style:italic;font-weight:700;font-size:clamp(28px,8vw,40px);line-height:1.3}
.mc{opacity:0;display:inline-block;animation:mc .45s ease-out forwards}
@keyframes mc{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}

/* English line: one clear colour, bounces in and gently waves, with coloured sparkles around it */
.eng-wrap{position:relative;width:100%;min-height:120px;margin-top:26px;display:flex;align-items:center;justify-content:center}
.eng{position:relative;z-index:1;font-family:"Fraunces",Georgia,serif;font-style:italic;font-weight:700;
  font-size:clamp(24px,7vw,34px);line-height:1.45;margin:0;padding:0 6px;color:var(--gold)}
.eng .ec{display:inline-block;opacity:0;text-shadow:0 0 12px rgba(255,217,138,.35)}
@keyframes engIn{
  from{opacity:0;transform:translateY(30px) rotate(-22deg) scale(.4)}
  to{opacity:1;transform:none}}
@keyframes wave{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.eng-star{position:absolute;z-index:0;pointer-events:none;font-size:clamp(14px,4vw,20px);opacity:0;
  animation:twinkle 1.8s ease-in-out infinite alternate, hue 4s linear infinite}
@keyframes twinkle{
  from{opacity:.15;transform:scale(.6) rotate(0deg)}
  to{opacity:1;transform:scale(1.25) rotate(25deg)}}
@keyframes hue{from{filter:hue-rotate(0deg) saturate(2)}to{filter:hue-rotate(360deg) saturate(2)}}

.spark{position:fixed;z-index:7;pointer-events:none;font-size:20px;animation:spark 1.2s ease-out forwards}
@keyframes spark{to{transform:translate(var(--dx),var(--dy)) scale(.5);opacity:0}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<div id="sky" aria-hidden="true"></div>
<div id="balloons" aria-hidden="true"></div>
<canvas id="conf" aria-hidden="true"></canvas>
<main>
  <h1 id="title" aria-label="Happy Birthday, Samiya!"><span class="l1" id="l1"></span><span class="l2" id="l2"></span></h1>
  <div class="cal" id="cal" aria-label="27 December">
    <div class="holes"><i></i><i></i></div>
    <div class="top">December</div>
    <div class="num">27</div>
  </div>

  <div class="scene" id="sceneBox">
  <svg id="scene" class="d1" viewBox="0 0 360 280" role="img" aria-label="Someone lights the candles, blows them out, then cuts the cake">
    <defs>
      <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a1a5c"/><stop offset="1" stop-color="#171040"/></linearGradient>
      <radialGradient id="gl"><stop offset="0" stop-color="#ffd27a" stop-opacity=".85"/><stop offset="1" stop-color="#ffd27a" stop-opacity="0"/></radialGradient>
    </defs>
    <rect width="360" height="280" fill="url(#wall)"/>

    <polygon points="133,34 155,34 144,58" fill="#8fb4ff"/><polygon points="187,35 209,35 198,59" fill="#b58cff"/>
    <polygon points="241,32 263,32 252,56" fill="#6fe0b5"/><polygon points="295,27 317,27 306,51" fill="#ff9a62"/>

    <g id="person">
      <path d="M36 150 Q62 140 88 150 L100 216 L24 216Z" fill="#ff7a9c"/>

        <path d="M35 110 Q35 76 62 76 Q89 76 89 110 L91 160 Q62 170 33 160Z" fill="#2a1b3d"/>
        <rect x="56" y="126" width="12" height="20" fill="#f3c9a8"/>
        <circle cx="62" cy="109" r="22" fill="#f3c9a8"/>
        <path d="M40 106 Q44 82 62 82 Q80 82 84 106 Q62 92 40 106Z" fill="#2a1b3d"/>
        <circle cx="54" cy="111" r="2.2" fill="#2a1b3d"/><circle cx="71" cy="111" r="2.2" fill="#2a1b3d"/>
        <circle cx="48" cy="118" r="4" fill="#ff9db5" opacity=".6"/><circle cx="76" cy="118" r="4" fill="#ff9db5" opacity=".6"/>
        <path id="mS" d="M55 119 Q62 126 69 119" fill="none" stroke="#b5405a" stroke-width="2" stroke-linecap="round"/>
        <ellipse id="mO" cx="62" cy="121" rx="4" ry="4.5" fill="#b5405a"/>
      </g>
    </g>

    <rect y="214" width="360" height="66" fill="#33204f"/><rect y="214" width="360" height="5" fill="#5b3a7a"/>
    <ellipse cx="172" cy="214" rx="100" ry="9" fill="#f5e6ff"/>
    <rect x="100" y="172" width="144" height="42" rx="9" fill="#ff9db5"/>
    <rect x="100" y="172" width="144" height="9" rx="4.5" fill="#fff3f7"/>
    <rect x="120" y="137" width="104" height="36" rx="9" fill="#b9a7f0"/>
    <rect x="120" y="137" width="104" height="9" rx="4.5" fill="#fff3f7"/>
    <path d="M132 144v9a4 4 0 0 0 8 0v-9zM176 144v11a4 4 0 0 0 8 0v-11zM204 144v8a4 4 0 0 0 8 0v-8z" fill="#fff3f7"/>
    <path d="M114 181v8a4 4 0 0 0 8 0v-8zM160 181v10a4 4 0 0 0 8 0v-10zM214 181v8a4 4 0 0 0 8 0v-8z" fill="#fff3f7"/>
    <g fill="#ffd98a"><circle cx="140" cy="162" r="2.5"/><circle cx="172" cy="164" r="2.5"/><circle cx="206" cy="161" r="2.5"/><circle cx="125" cy="203" r="2.5"/><circle cx="190" cy="204" r="2.5"/></g>
    <g id="gap"><rect x="218" y="172" width="26" height="42" fill="#ffe2b8"/><rect x="206" y="137" width="18" height="35" fill="#ffe2b8"/></g>
    <rect x="146" y="108" width="8" height="29" rx="2" fill="#7fd6ff"/><rect x="161" y="108" width="8" height="29" rx="2" fill="#ffd05a"/><rect x="176" y="108" width="8" height="29" rx="2" fill="#ff8fd1"/>
    <g stroke="#3a2a2a" stroke-width="1.6"><path d="M150 104v4M165 104v4M180 104v4"/></g>
    <g id="slice"><ellipse cx="316" cy="214" rx="34" ry="7" fill="#f5e6ff"/>
      <rect x="300" y="201" width="30" height="12" fill="#ff9db5"/><rect x="300" y="190" width="30" height="11" fill="#b9a7f0"/>
      <rect x="300" y="190" width="30" height="4" fill="#fff3f7"/><circle cx="315" cy="187" r="4" fill="#e0334f"/></g>

    <rect id="dim" width="360" height="280" fill="#0b0720"/>

    <g class="sm"><path transform="translate(150 100)" d="M0 0c-5-8 5-14 0-24" fill="none" stroke="#c7b9e6" stroke-width="2.4" stroke-linecap="round"/></g>
    <g class="sm"><path transform="translate(165 100)" d="M0 0c5-8-5-14 0-24" fill="none" stroke="#c7b9e6" stroke-width="2.4" stroke-linecap="round"/></g>
    <g class="sm"><path transform="translate(180 100)" d="M0 0c-5-8 5-14 0-24" fill="none" stroke="#c7b9e6" stroke-width="2.4" stroke-linecap="round"/></g>

    <g class="fl" style="transform-origin:150px 106px;--d:.9s;--o:0s"><g transform="translate(150 106)"><circle cy="-14" r="30" fill="url(#gl)"/><g class="fk"><path d="M0-20C6-12 8-6 4.5-1 2 2-2 2-4.5-1-8-6-5-12 0-20Z" fill="#ffc94d"/><path d="M0-11C3-7 4-4 2-2 1-1-1-1-2-2-4-4-2-7 0-11Z" fill="#fff3c4"/></g></g></g>
    <g class="fl" style="transform-origin:165px 106px;--d:1.62s;--o:.12s"><g transform="translate(165 106)"><circle cy="-14" r="30" fill="url(#gl)"/><g class="fk"><path d="M0-20C6-12 8-6 4.5-1 2 2-2 2-4.5-1-8-6-5-12 0-20Z" fill="#ffc94d"/><path d="M0-11C3-7 4-4 2-2 1-1-1-1-2-2-4-4-2-7 0-11Z" fill="#fff3c4"/></g></g></g>
    <g class="fl" style="transform-origin:180px 106px;--d:2.34s;--o:.24s"><g transform="translate(180 106)"><circle cy="-14" r="30" fill="url(#gl)"/><g class="fk"><path d="M0-20C6-12 8-6 4.5-1 2 2-2 2-4.5-1-8-6-5-12 0-20Z" fill="#ffc94d"/><path d="M0-11C3-7 4-4 2-2 1-1-1-1-2-2-4-4-2-7 0-11Z" fill="#fff3c4"/></g></g></g>

    <g fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round">
      <path class="puff" style="--p:.45s" d="M74 119q7-3 14 0"/><path class="puff" style="--p:.6s" d="M74 123q7-3 14 0"/><path class="puff" style="--p:.75s" d="M74 115q7-3 14 0"/>
    </g>

        <rect x="150" y="154.5" width="22" height="3" rx="1.5" fill="#e8c39e"/>
        <circle cx="174" cy="156" r="3.8" fill="#e0453a"/>
        <circle cx="174" cy="148" r="12" fill="url(#gl)"/>

      </g>

        <rect x="150" y="151" width="16" height="10" rx="3" fill="#5b3a2e"/>

  </div>
  <p class="cap" id="cap" aria-live="polite"></p>

  <section class="stage" id="stage">
    <div class="card" id="card"><p class="msg" id="msg" aria-live="polite"></p></div>
    <div class="eng-wrap" id="engWrap"><p class="eng" id="eng" aria-live="polite"></p></div>
  </section>
</main>

<script>
(function(){
  var $=function(id){return document.getElementById(id)};
  var cols=['#ff7a9c','#ffd05a','#8fb4ff','#b58cff','#6fe0b5','#ff9a62','#ff8fd1'];

  /* stars */
  var sky=$('sky');
  for(var i=0;i<60;i++){
    var t=document.createElement('div');t.className='tw';var s=Math.random()*2.4+1;
    t.style.cssText='width:'+s+'px;height:'+s+'px;left:'+Math.random()*100+'%;top:'+Math.random()*100+'%;animation-duration:'+(1.5+Math.random()*3)+'s;animation-delay:-'+Math.random()*3+'s';
    sky.appendChild(t);
  }

  /* title, letter by letter */
  var n=0,STEP=100;
  function build(el,text,gap){
    text.split(' ').forEach(function(word,wi,arr){
      var w=document.createElement('span');w.className='w';
      for(var i=0;i<word.length;i++){
        var c=document.createElement('span');c.className='ch';c.textContent=word[i];
        c.style.animationDelay=(n*STEP/1000+.3)+'s';n++;w.appendChild(c);
      }
      el.appendChild(w);
      if(wi<arr.length-1)el.appendChild(document.createTextNode(' '));
    });
    n+=gap;
  }
  build($('l1'),'Happy Birthday,',2);
  build($('l2'),'Samiya!',0);
  var tms=n*STEP+900;
  setTimeout(function(){$('title').classList.add('shine');$('cal').classList.add('in')},tms);
  setTimeout(function(){$('sceneBox').classList.add('in');
    setTimeout(function(){$('sceneBox').scrollIntoView({behavior:'smooth',block:'center'})},500);
    setTimeout(runScene,1100)},tms+1300);

  /* the scene: light, blow, cut */
  var svg=$('scene'),cap=$('cap'),stage=$('stage'),timers=[];
  function at(ms,fn){timers.push(setTimeout(fn,ms))}
  function say(txt){cap.style.opacity=0;setTimeout(function(){cap.textContent=txt;cap.style.opacity=1},260)}
  function dim(c){svg.classList.remove('d0','d2');if(c)svg.classList.add(c)}
  function runScene(){
    timers.forEach(clearTimeout);timers=[];
    svg.setAttribute('class','d1');void svg.getBoundingClientRect();
    stage.classList.remove('show');
    say('Mombatti jalano hocche…');svg.classList.add('lit');
    at(4300,function(){say('Ebar fu diye nibhao…');svg.classList.add('blow')});
    at(5300,function(){svg.classList.add('out')});
    at(7000,function(){say('Mone mone ekta wish koro ✨');dim('d2')});
    at(8400,function(){dim('d0');say('Happy Birthday! 🎉');svg.classList.add('happy');confetti(170);setTimeout(function(){confetti(110)},500);rain(14)});
    at(10300,function(){say('Ebar kek kata…');svg.classList.add('cut')});
    at(13500,function(){say('Tomar jonno kichu kotha 💖');stage.classList.add('show');startMessages();
      setTimeout(function(){stage.scrollIntoView({behavior:'smooth',block:'center'})},400)});
  }

  /* confetti */
  var cv=$('conf'),cx=cv.getContext('2d'),parts=[],running=false,dpr=Math.min(window.devicePixelRatio||1,2);
  function fit(){cv.width=innerWidth*dpr;cv.height=innerHeight*dpr;cx.setTransform(dpr,0,0,dpr,0,0)}
  fit();addEventListener('resize',fit);
  function confetti(k){
    var r=svg.getBoundingClientRect(),ox=r.left+r.width/2,oy=r.top+r.height*.4;
    for(var i=0;i<k;i++){var a=Math.random()*6.28,sp=Math.random()*9+3;
      parts.push({x:ox,y:oy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-5,w:Math.random()*7+4,h:Math.random()*4+3,
        r:Math.random()*6,vr:(Math.random()-.5)*.4,l:1,c:cols[i%cols.length]})}
    if(!running){running=true;requestAnimationFrame(loop)}
  }
  function loop(){
    cx.clearRect(0,0,innerWidth,innerHeight);
    parts=parts.filter(function(p){return p.l>0&&p.y<innerHeight+30});
    parts.forEach(function(p){
      p.x+=p.vx;p.y+=p.vy;p.vy+=.22;p.vx*=.985;p.r+=p.vr;p.l-=.006;
      cx.save();cx.globalAlpha=Math.min(1,p.l*2);cx.translate(p.x,p.y);cx.rotate(p.r);
      cx.fillStyle=p.c;cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);cx.restore();
    });
    if(parts.length)requestAnimationFrame(loop);else{running=false;cx.clearRect(0,0,innerWidth,innerHeight)}
  }

  /* messages: play automatically, stay on screen, no buttons */
  var HEAD='Happy Birthday, Samiya! 🥳💖';
  var BENGALI='Ajker ei special dine tomar jonno roilo onek onek shubhokamna. Allah jeno tomake sobsomoy sustho o bhalo rakhen. Tomar jiboner protiti din jeno anondo ar shantite vore thake. Allah jeno tomar moner sob bhalo iccha puron koren ebong jiboner protiti khetre sofolota dan koren. Sob somoy hasi-khushi thako, nijer kheyal rekho.';
  var ENGLISH='Enjoy your special day! Stay blessed. ❤️🎀';
  var msg=$('msg'),eng=$('eng'),engWrap=$('engWrap');
  var seg=window.Intl&&Intl.Segmenter?new Intl.Segmenter():null;
  function chars(str){return seg?Array.from(seg.segment(str),function(x){return x.segment}):Array.from(str)}

  /* writes text letter by letter, returns how long it takes in ms */
  function write(el,text,cls,gap){
    el.innerHTML='';el.className=cls;
    var k=0;
    text.split(' ').forEach(function(word,wi,arr){
      var w=document.createElement('span');w.className='w';
      chars(word).forEach(function(ch){
        var c=document.createElement('span');c.className='mc';c.textContent=ch;
        c.style.animationDelay=(k*gap)+'ms';k++;w.appendChild(c);
      });
      el.appendChild(w);
      if(wi<arr.length-1){el.appendChild(document.createTextNode(' '));k++}
    });
    return k*gap;
  }

  function startMessages(){
    var t1=write(msg,HEAD,'msg big',80);
    setTimeout(function(){
      var t2=write(msg,BENGALI,'msg',42);
      setTimeout(showEnglish,t2+1000);
    },t1+900);
  }

  /* English line: word-level nowrap so words never split, letters still bounce & wave */
  function showEnglish(){
    eng.innerHTML='';
    var idx=0;
    ENGLISH.split(' ').forEach(function(word,wi,arr){
      var w=document.createElement('span');w.className='w';
      chars(word).forEach(function(ch){
        var c=document.createElement('span');c.className='ec';
        c.textContent=ch;
        var d=idx*70;
        c.style.animation='engIn .6s '+d+'ms both, wave 2.2s '+(d+600)+'ms ease-in-out infinite';
        w.appendChild(c);idx++;
      });
      eng.appendChild(w);
      if(wi<arr.length-1){eng.appendChild(document.createTextNode(' '));idx++}
    });
    sparkles(18);
    setTimeout(function(){confetti(90);rain(8)},idx*70+400);
  }

  /* coloured ⭐ ✨ that twinkle and cycle through hues around the English line */
  function sparkles(k){
    for(var i=0;i<k;i++){
      var s=document.createElement('span');
      s.className='eng-star';
      s.textContent=i%3===0?'✨':'⭐';
      s.style.left=(Math.random()*92)+'%';
      s.style.top=(Math.random()*90)+'%';
      s.style.animationDelay=(Math.random()*1.5)+'s, '+(-Math.random()*4)+'s';
      engWrap.appendChild(s);
    }
  }

  /* falling balloons */
  var wrap=$('balloons');
  function balloon(){
    var f=document.createElement('div'),s=document.createElement('div'),b=document.createElement('div');
    var w=46+Math.random()*44,col=cols[Math.floor(Math.random()*cols.length)],dur=9+Math.random()*7;
    f.className='fall';s.className='sway';b.className='b';
    f.style.left=(Math.random()*(innerWidth-w))+'px';f.style.animationDuration=dur+'s';
    s.style.animationDuration=(2.2+Math.random()*2)+'s';
    b.style.width=w+'px';b.style.height=(w*1.22)+'px';
    b.style.background='radial-gradient(circle at 35% 30%,#fff9,'+col+' 45%)';b.style.borderBottomColor=col;
    s.appendChild(b);f.appendChild(s);wrap.appendChild(f);
    f.addEventListener('animationend',function(e){if(e.target===f)f.remove()});
  }
  function rain(k){for(var i=0;i<k;i++)setTimeout(function(){if(wrap.children.length<26)balloon()},i*240)}
})();
</script>
</body>
</html>
